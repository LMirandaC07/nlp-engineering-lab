[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nlp-engineering-lab"
version = "0.1.0"
description = "Laboratório reproduzível de NLP e sistemas GenAI em português."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "scikit-learn>=1.5,<2",
  "pandas>=2.2,<4",
  "joblib>=1.4,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "mlflow>=2.17,<4",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.7,<1"]
mcp = ["mcp>=1.12,<2"]
genai = ["google-genai>=1.39,<2"]
transformers = ["torch>=2.4", "transformers>=4.45,<6", "datasets>=3,<5", "evaluate>=0.4,<1"]

[project.scripts]
nlp-lab-train = "nlp_lab.train:main"
nlp-lab-mcp = "nlp_lab.mcp_server:main"
nlp-lab-eval-rag = "nlp_lab.eval_rag:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nlp_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
